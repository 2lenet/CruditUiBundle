name: PHPUnit

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    phpunit:
        name: "PHPUnit ${{ matrix.php_version }}"

        runs-on: ubuntu-latest
        strategy:
            matrix:
                php_version: [8.4]

        steps:
            -   uses: actions/checkout@v4

            -   name: "Install dependencies with Composer"
                uses: php-actions/composer@v6
                with:
                    php_version: ${{ matrix.php_version }}
                    version: 2
                    args: --profile --ignore-platform-reqs

            -   name: "Run PHPUnit"
                run: vendor/bin/phpunit -c tests/phpunit/phpunit.xml
