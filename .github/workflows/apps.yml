name: Test applications

# The bundle is installed in a Symfony application for each asset tool it supports (AssetMapper, Webpack Encore),
# then headless browsers (Playwright: Chromium, WebKit, an iPhone and an Android phone) check that the stylesheet is loaded, that the project can override it and that a
# Stimulus controller of the bundle works (tests/apps/smoke.mjs). The application turbo (AssetMapper and Symfony UX
# Turbo) runs the same test, then the components under real Turbo visits (tests/apps/smoke-turbo.mjs).

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    app:
        name: "${{ matrix.app }} (${{ matrix.env }})"

        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   {app: assetmapper, env: dev}
                    -   {app: assetmapper, env: prod}
                    -   {app: encore, env: dev}
                    -   {app: encore, env: prod}
                    -   {app: turbo, env: dev}
                    -   {app: turbo, env: prod}

        env:
            APP_SECRET: ci
            APP_ENV: ${{ matrix.env }}

        defaults:
            run:
                working-directory: tests/apps/${{ matrix.app }}

        steps:
            -   uses: actions/checkout@v4

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.4'
                    tools: composer:v2
                    # numbers and dates in every locale (ui_number, ui_date...)
                    extensions: intl

            -   uses: actions/setup-node@v4
                with:
                    node-version: 22

            # The bundle is copied into vendor/ (path repository, symlink: false), as a project does.
            -   name: 'Install the application'
                run: composer install --no-interaction --prefer-dist

            # The icons are not committed: imported as a project does before committing, which also tests the Finder.
            -   name: 'Import the icons'
                run: php bin/console ux:icons:lock

            # `encore dev` (source maps, no versioning) is the build a developer runs every day; `encore production` the deployed one.
            -   name: 'Build the assets (Encore)'
                if: matrix.app == 'encore'
                run: |
                    npm install --no-audit --no-fund
                    npm run ${{ matrix.env == 'prod' && 'build' || 'dev' }}

            -   name: 'Compile the assets (AssetMapper, production)'
                if: matrix.app != 'encore' && matrix.env == 'prod'
                run: php bin/console asset-map:compile

            -   name: 'Start the server'
                run: |
                    php bin/console cache:warmup
                    php -S 127.0.0.1:8080 -t public > /tmp/server.log 2>&1 &
                    npx --yes wait-on http://127.0.0.1:8080/ --timeout 30000

            # Playwright: Chromium and WebKit with their system libraries (tests/apps/browser.mjs).
            -   name: 'Install the browsers'
                working-directory: tests/apps
                run: |
                    npm install --no-audit --no-fund
                    npx playwright install --with-deps chromium webkit

            # The same test on every project: Chrome and Safari on a desktop, Safari on an iPhone, Chrome on Android.
            -   name: 'Smoke test'
                working-directory: tests/apps
                run: |
                    failed=0
                    for project in chromium webkit iphone pixel; do
                        echo "::group::smoke $project"
                        node smoke.mjs http://127.0.0.1:8080/ $project || failed=1
                        echo "::endgroup::"
                    done
                    exit $failed

            -   name: 'Smoke test under Turbo'
                if: matrix.app == 'turbo'
                working-directory: tests/apps
                run: |
                    failed=0
                    for project in chromium webkit iphone pixel; do
                        echo "::group::smoke-turbo $project"
                        node smoke-turbo.mjs http://127.0.0.1:8080/ $project || failed=1
                        echo "::endgroup::"
                    done
                    exit $failed

            -   name: 'Server log'
                if: failure()
                run: cat /tmp/server.log
