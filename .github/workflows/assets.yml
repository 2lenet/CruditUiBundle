name: Assets

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    assets:
        name: "Compiled CSS and JavaScript tests"

        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-node@v4
                with:
                    node-version: 22
                    cache: npm
                    cache-dependency-path: assets/package-lock.json

            -   name: 'Install dependencies'
                run: npm ci
                working-directory: assets

            -   name: 'assets/dist/ui.css is the compilation of assets/styles'
                run: npm run check
                working-directory: assets

            -   name: 'Tests'
                run: npm test
                working-directory: assets
